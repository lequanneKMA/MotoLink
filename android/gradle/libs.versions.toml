# Version status (docs/design/research/unverified.md U11):
#  - VERIFIED to exist on 2026-10-10 (Maven Central): kotlin plugin 2.3.21, ksp 2.3.12, coroutines 1.10.2,
#    retrofit 3.0.0, maplibre 13.6.1 (kotlin 2.4.x also exists).
#  - UNVERIFIED (Google Maven is blocked in the authoring sandbox): AGP, androidx.*, play-services,
#    okhttp, serialization, converter. Values below are best-known; bump to the latest stable on first Gradle sync.
[versions]
kotlin = "2.3.21"
ksp = "2.3.12"
agp = "8.13.0"
coroutines = "1.10.2"
serialization = "1.9.0"
composeBom = "2025.09.00"
activityCompose = "1.11.0"
navigationCompose = "2.9.5"
lifecycle = "2.9.4"
coreKtx = "1.17.0"
room = "2.8.1"
work = "2.10.4"
datastore = "1.1.7"
playServicesLocation = "21.3.0"
okhttp = "5.1.0"
retrofit = "3.0.0"
maplibre = "13.6.1"
junit = "4.13.2"

[libraries]
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
