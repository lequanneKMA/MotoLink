name: ci
on: [push, pull_request]
jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: server/go.mod }
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race -count=1
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...
  android-logic:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: ./gradlew :logic:test --no-daemon
      # The :app module needs the Android SDK; GitHub's ubuntu image ships one. First run after a fresh clone
      # will also show whether the unverified library versions in gradle/libs.versions.toml resolve.
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
